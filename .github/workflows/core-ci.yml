name: 🔧 Core CI - Essential Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DEMO_TIMEOUT: 60s # Increased for CI stability

permissions:
  contents: read

jobs:
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust-code: ${{ steps.changes.outputs.rust-code }}
      docs: ${{ steps.changes.outputs.docs }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            rust-code:
              - 'crates/**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**/Cargo.toml'
            docs:
              - 'docs/**'
              - '*.md'
              - '.github/copilot-instructions.md'
            workflows:
              - '.github/workflows/**'

  pr-validation:
    name: 🔍 PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate PR metadata
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REPO_CLONE: ${{ github.event.repository.clone_url }}
        run: |
          git config --global --add safe.directory /github/workspace
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$REPO_CLONE"
          git fetch upstream "$BASE_REF"
          ./scripts/validate-pr.sh --commit-range "upstream/${BASE_REF}..HEAD" --branch-name "$HEAD_REF"

  lint:
    name: 🎨 Lint & Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-deps"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-debug:
    name: 🧪 Test (Debug)
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust-code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nextest
        uses: taiki-e/install-action@7646916979096be288829d3d80a5e43636357a04

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-deps"

      - name: Build tests
        run: cargo test --no-run --workspace

      - name: Run tests
        run: cargo nextest run --workspace

      - name: Run doc tests
        run: cargo test --doc --workspace

  demo-check:
    name: 🎮 Demo Validation
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust-code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-deps"

      - name: Build CLI
        run: cargo build --package gc_cli

      - name: Validate Demos
        run: |
          echo "Running demos with timeout $DEMO_TIMEOUT..."
          timeout "$DEMO_TIMEOUT" cargo run -p gc_cli -- --width 20 --height 10 mapgen > /dev/null
          timeout "$DEMO_TIMEOUT" cargo run -p gc_cli -- --width 30 --height 15 path > /dev/null
          timeout "$DEMO_TIMEOUT" cargo run -p gc_cli -- save-load > /dev/null
          timeout "$DEMO_TIMEOUT" cargo run -p gc_cli -- fov > /dev/null

  # -------------------------------------------------------------------------
  # Extended Checks (Main Branch / Dispatch Only)
  # -------------------------------------------------------------------------

  build-release:
    name: 🔨 Build Release
    runs-on: ubuntu-latest
    needs: [changes, test-debug]
    # Only run on main branch or manual dispatch
    if: |
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.rust-code == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-deps"

      - name: Build Release
        run: cargo build --release --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goblin-camp-release-${{ github.sha }}
          path: target/release/gc_cli
          retention-days: 7

  coverage:
    name: 📊 Coverage
    runs-on: ubuntu-latest
    needs: [changes, test-debug]
    if: |
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.rust-code == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tools
        uses: taiki-e/install-action@7646916979096be288829d3d80a5e43636357a04
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-deps"

      - name: Generate Coverage
        run: |
          cargo llvm-cov nextest --lcov --output-path lcov.info --package gc_core
          cargo llvm-cov nextest --html --output-dir html-coverage --package gc_core
          cargo llvm-cov --fail-under-lines 75 --summary-only --package gc_core

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            html-coverage/

  audit-and-docs:
    name: 🔒 Security & Docs
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.rust-code == 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tools
        uses: taiki-e/install-action@7646916979096be288829d3d80a5e43636357a04
        with:
          tool: cargo-audit,cargo-deny

      - name: Security Audit
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

      - name: License Check
        run: cargo deny check --hide-inclusion-graph

      - name: Build Docs
        run: cargo doc --workspace --no-deps --quiet

  summary-pr:
    name: ✅ CI Summary (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [changes, pr-validation, lint, test-debug, demo-check, build-release, coverage, audit-and-docs]
    steps:
      - name: Check Status
        run: |
          FAILED=0

          if [[ "${{ needs.pr-validation.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.test-debug.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.demo-check.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.build-release.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.coverage.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.audit-and-docs.result }}" == "failure" ]]; then FAILED=1; fi

          if [[ $FAILED -eq 1 ]]; then
            echo "❌ Critical checks failed."
            exit 1
          fi

          echo "✅ All required checks passed."

  summary-main:
    name: ✅ CI Summary (Main/Dispatch)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [changes, lint, test-debug, demo-check, build-release, coverage, audit-and-docs]
    steps:
      - name: Check Status
        run: |
          FAILED=0

          if [[ "${{ needs.lint.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.test-debug.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.demo-check.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.build-release.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.coverage.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.audit-and-docs.result }}" == "failure" ]]; then FAILED=1; fi

          if [[ $FAILED -eq 1 ]]; then
            echo "❌ Critical checks failed."
            exit 1
          fi

          echo "✅ All required checks passed."
